<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地震避险 - 紧急救援模拟训练营</title>
  <link rel="stylesheet" href="../css/style.css?v=16">
  <style>
    .shake-scene { animation: sceneShake 0.6s ease-in-out infinite; }
    @keyframes sceneShake {
      0%,100%{transform:translateX(0)rotate(0deg)}
      10%{transform:translateX(-8px)rotate(-1.5deg)}
      20%{transform:translateX(8px)rotate(1deg)}
      30%{transform:translateX(-6px)rotate(-1deg)}
      40%{transform:translateX(6px)rotate(.8deg)}
      50%{transform:translateX(-4px)rotate(-.5deg)}
      60%{transform:translateX(4px)rotate(.5deg)}
      70%{transform:translateX(-2px)rotate(-.3deg)}
      80%{transform:translateX(2px)}
      90%{transform:translateX(-1px)}
    }
    .falling-item{position:absolute;animation:itemFall 1s ease-in infinite;font-size:20px}
    @keyframes itemFall{0%{transform:translateY(-30px)rotate(0deg);opacity:0}30%{opacity:1}100%{transform:translateY(120px)rotate(180deg);opacity:0}}
    .crack-line{position:absolute;background:rgba(0,0,0,.3);animation:crackGrow 1.5s ease-in-out infinite alternate}
    @keyframes crackGrow{0%{width:10px;opacity:.2}100%{width:80px;opacity:.6}}
  </style>
</head>
<body>
  <div class="scene-layout" id="sceneLayout">
    <div class="scene-main">
      <div class="scene-container" id="app">
        <div id="cover">
          <a href="../index.html" class="back-link">← 返回大厅</a>
      <div class="scene-cover" style="background:linear-gradient(150deg,#8d6e63,#5d4037)">
        <span class="cover-icon">🏔️</span>
        <h2>地震来了别慌张</h2>
        <p class="cover-desc">课桌突然剧烈晃动，吊灯左右摇摆！地震来临时，短短几秒的决定就关系到生命安全。来学习最正确的地震避险方法吧！</p>
        <p class="cover-goal">🎯 学完你就能：判断不同场景的避险方式 → 掌握"伏地遮挡抓牢" → 安全有序撤离</p>
      </div>
      <button class="btn btn-primary btn-center" onclick="window._startGame()">开始闯关！</button>
    </div>
    <div id="game" class="hidden">
      <div class="progress-bar" id="progress"></div>
      <div class="level-area active" id="levelContent"></div>
      <button class="btn btn-primary btn-center" id="nextBtn" onclick="window._nextLevel()" style="visibility:hidden">继续下一关 →</button>
    </div>
    <div id="result" class="hidden"></div>
  </div>

  <script src="../js/scenarios.js?v=15"></script>
  <script src="../js/engine.js?v=15"></script>
  <script src="../js/ai-helper.js?v=15"></script>
  <script src="../js/app.js?v=15"></script>
  <script src="../js/assistant.js?v=15"></script>
  <script src="../js/scene-runner.js?v=15"></script>
  <script>
    initScene('earthquake', function(sceneId, levelIndex) {
      const items = ['📚','📎','✏️','🖼️','🧸'];
      let html = '<div style="position:absolute;inset:0;overflow:hidden">';
      items.forEach((item, i) => {
        html += `<span class="falling-item" style="left:${15+i*18}%;animation-delay:${i*0.2}s">${item}</span>`;
      });
      html += '<div class="crack-line" style="top:50%;left:30%;height:3px"></div>';
      html += '<div class="crack-line" style="top:45%;left:50%;height:2px;animation-delay:.3s"></div>';
      html += '</div>';
      return html;
    });
  </script>
    </div>
  </div>
</body>
</html>
